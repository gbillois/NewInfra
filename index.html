<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyber News — Synthèse</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <h1><a href="/">Cyber News</a></h1>
        <nav>
          <a href="/" class="active">Synthèse</a>
          <a href="/settings.html">Paramètres</a>
          <a href="#" id="logout-link" hidden>Déconnexion</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <section class="controls">
        <div class="periods" role="tablist">
          <button class="period" data-period="day" aria-selected="true">Jour (24h)</button>
          <button class="period" data-period="week">Semaine (7j)</button>
          <button class="period" data-period="fortnight">Quinzaine (15j)</button>
          <button class="period" data-period="month">Mois (30j)</button>
        </div>
        <div class="actions">
          <button id="refresh-btn" class="primary">↻ Rafraîchir la synthèse</button>
        </div>
      </section>

      <section id="status" class="status" aria-live="polite"></section>

      <article id="synthesis">
        <div class="placeholder">Chargement…</div>
      </article>

      <section id="sources" hidden>
        <h2>Articles sources</h2>
        <ul id="sources-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span id="meta-line"></span>
      </div>
    </footer>

    <script src="/app.js" defer></script>
  </body>
</html>

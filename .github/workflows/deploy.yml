name: Deploy NewInfraGG to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/cloudflare-pages-d1-setup-GNlHm
      - claude/cyber-news-aggregator-alYSB
      - claude/vector-article-consolidation-73XvG
  workflow_dispatch:

concurrency:
  group: deploy-newinfragg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: newinfragg-db
      # Vectorize indexes backing the vector consolidation mode.
      # One index per embedding model (dimensions differ):
      #   - bge-m3 (Workers AI / Anthropic fallback) → 1024 dims
      #   - text-embedding-3-small (OpenAI)         → 1536 dims
      # Both use cosine distance. Bindings in wrangler.toml are
      # VECTORIZE (bge-m3) and VECTORIZE_OPENAI (openai-small); the
      # app picks the right one based on the configured LLM provider.
      VECTORIZE_INDEX: newinfragg-vectors-bge-m3
      VECTORIZE_DIMS: "1024"
      VECTORIZE_METRIC: cosine
      VECTORIZE_INDEX_OPENAI: newinfragg-vectors-openai-small
      VECTORIZE_DIMS_OPENAI: "1536"
      # Cloudflare Pages project names and the wrangler.toml `name`
      # field must be lowercase-alphanumeric-with-dashes only, so the
      # display "NewInfraGG" is stored as "newinfragg".
      PROJECT_NAME: newinfragg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler and jq
        run: |
          set -euo pipefail
          npm install -g wrangler@3
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Verify Cloudflare credentials are present
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Ensure D1 database exists and append binding to wrangler.toml
        id: d1
        run: |
          set -euo pipefail

          # Guard: committed wrangler.toml must NOT contain a
          # [[d1_databases]] block — the workflow appends it with the
          # real database_id once we know it. wrangler validates
          # database_id as a UUID at config-parse time, so a stub in
          # the committed file would break every wrangler command.
          if grep -q '^\[\[d1_databases\]\]' wrangler.toml; then
            echo "::error::wrangler.toml already contains [[d1_databases]] — remove the committed block; the workflow appends it."
            exit 1
          fi

          lookup_id() {
            wrangler d1 list --json 2>/dev/null \
              | jq -r --arg n "$DB_NAME" \
                  '.[] | select(.name==$n) | .uuid' \
              | head -1
          }

          DB_ID="$(lookup_id || true)"

          if [ -z "${DB_ID}" ]; then
            echo "D1 database '$DB_NAME' not found — creating it..."
            if CREATE_OUT=$(wrangler d1 create "$DB_NAME" 2>&1); then
              echo "$CREATE_OUT"
              DB_ID=$(echo "$CREATE_OUT" \
                | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
                | head -1 || true)
            else
              echo "$CREATE_OUT"
              if echo "$CREATE_OUT" | grep -qiE "already exists|name is already taken"; then
                echo "Race: DB appeared between list and create — re-fetching id..."
                DB_ID="$(lookup_id || true)"
              else
                echo "::error::wrangler d1 create failed — see log above"
                exit 1
              fi
            fi
          else
            echo "Reusing existing D1 database '$DB_NAME' (id=$DB_ID)."
          fi

          if [ -z "${DB_ID}" ]; then
            echo "::error::Could not resolve D1 database_id after create + lookup"
            exit 1
          fi

          # Validate the resolved id looks like a UUID before writing.
          if ! echo "$DB_ID" | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::Resolved DB_ID is not a valid UUID: $DB_ID"
            exit 1
          fi

          echo "Resolved D1 database_id: $DB_ID"

          # Append the complete D1 binding block to wrangler.toml.
          # YAML's `run: |` strips the common base indent, so each line
          # below is flush-left in the actual shell and the heredoc
          # writes flush-left TOML keys.
          {
            printf '\n[[d1_databases]]\n'
            printf 'binding = "DB"\n'
            printf 'database_name = "%s"\n' "$DB_NAME"
            printf 'database_id = "%s"\n' "$DB_ID"
            printf 'migrations_dir = "migrations"\n'
          } >> wrangler.toml

          echo "--- final wrangler.toml ---"
          cat wrangler.toml

      - name: Ensure Vectorize indexes exist and append bindings to wrangler.toml
        id: vectorize
        # Vectorize requires the Workers Paid plan and the feature to be
        # enabled on the account. A failure here MUST NOT break the
        # deploy: the legacy LLM consolidation mode works without any
        # Vectorize binding, so we degrade gracefully by simply not
        # appending the [[vectorize]] block(s) for indexes that could
        # not be provisioned. The vector consolidation modes will then
        # return a clear runtime error until the account is set up.
        run: |
          set -uo pipefail

          # Same guard as for D1: a committed [[vectorize]] block would
          # let wrangler read a stale binding and defeat the point of
          # appending the live one here.
          if grep -q '^\[\[vectorize\]\]' wrangler.toml; then
            echo "::error::wrangler.toml already contains [[vectorize]] — remove the committed block; the workflow appends it."
            exit 1
          fi

          # Cache the index list once. `wrangler vectorize list --json`
          # output shape varies across wrangler minor versions (some
          # wrap in {"indexes": [...]}, others return a bare array), so
          # we normalise via `(.indexes // .)`.
          INDEX_LIST_RAW="$(wrangler vectorize list --json 2>&1 || true)"
          INDEX_LIST="$(echo "$INDEX_LIST_RAW" | jq '(.indexes // .) // []' 2>/dev/null || echo '[]')"

          # ensure_index NAME DIMS METRIC
          # Prints progress and returns 0 on success (index exists or
          # was created), non-zero otherwise. Never exits the step.
          ensure_index() {
            local name="$1" dims="$2" metric="$3"
            local found create_out
            found=$(echo "$INDEX_LIST" | jq -r --arg n "$name" \
                      '.[] | select(.name==$n) | .name' 2>/dev/null | head -1 || true)
            if [ -n "$found" ]; then
              echo "Reusing existing Vectorize index '$name'."
              return 0
            fi

            echo "Vectorize index '$name' not found — creating it..."
            if create_out=$(wrangler vectorize create "$name" \
                              --dimensions="$dims" \
                              --metric="$metric" 2>&1); then
              echo "$create_out"
              return 0
            fi
            echo "$create_out"
            if echo "$create_out" | grep -qiE "already exists|name is already taken"; then
              echo "Race: index appeared between list and create — continuing."
              return 0
            fi
            echo "::warning::Could not create Vectorize index '$name'. The vector consolidation mode will be unavailable until this is resolved. Raw output above."
            return 1
          }

          append_binding() {
            local binding="$1" name="$2"
            {
              printf '\n[[vectorize]]\n'
              printf 'binding = "%s"\n' "$binding"
              printf 'index_name = "%s"\n' "$name"
            } >> wrangler.toml
            echo "Appended [[vectorize]] binding=$binding index_name=$name"
          }

          # Default index: Workers AI bge-m3 (also used when the selected
          # LLM provider is Anthropic, since Anthropic has no first-party
          # embedding API).
          if ensure_index "$VECTORIZE_INDEX" "$VECTORIZE_DIMS" "$VECTORIZE_METRIC"; then
            append_binding "VECTORIZE" "$VECTORIZE_INDEX"
          fi
          # OpenAI index: used when the LLM provider is openai.
          if ensure_index "$VECTORIZE_INDEX_OPENAI" "$VECTORIZE_DIMS_OPENAI" "$VECTORIZE_METRIC"; then
            append_binding "VECTORIZE_OPENAI" "$VECTORIZE_INDEX_OPENAI"
          fi

          echo "--- final wrangler.toml ---"
          cat wrangler.toml

      - name: Apply D1 migrations (remote)
        run: |
          set -euo pipefail
          # SQL is idempotent (IF NOT EXISTS + WHERE NOT EXISTS),
          # so re-applying on every run is safe.
          # Notes on the piping:
          # - `--yes` does NOT exist on `d1 migrations apply`, unlike
          #   `wrangler deploy` — we learned this from a CI failure.
          # - `wrangler d1 migrations apply --remote` may prompt for
          #   confirmation. We pipe a bounded `y\n` via `printf` so that
          #   (a) any prompt is auto-accepted, and (b) stdin reaches EOF
          #   cleanly, avoiding the SIGPIPE/141 trap that `yes |` hits
          #   under `set -o pipefail` when wrangler exits first.
          printf 'y\n' | wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Ensure Cloudflare Pages project exists
        run: |
          set -euo pipefail
          if wrangler pages project list --json \
               | jq -e --arg n "$PROJECT_NAME" \
                   '.[] | select(.name==$n)' > /dev/null; then
            echo "Pages project '$PROJECT_NAME' already exists — skipping create."
          else
            echo "Creating Pages project '$PROJECT_NAME'..."
            if CREATE_OUT=$(wrangler pages project create "$PROJECT_NAME" \
                              --production-branch main 2>&1); then
              echo "$CREATE_OUT"
            else
              echo "$CREATE_OUT"
              if echo "$CREATE_OUT" | grep -qiE "already exists|name is already taken"; then
                echo "Race: project appeared meanwhile — continuing."
              else
                echo "::error::wrangler pages project create failed"
                exit 1
              fi
            fi
          fi

      - name: Deploy to Cloudflare Pages (with retry)
        id: deploy
        run: |
          set -euo pipefail
          deploy() {
            wrangler pages deploy . \
              --project-name "$PROJECT_NAME" \
              --branch "${GITHUB_REF_NAME}" \
              --commit-dirty=true \
              2>&1 | tee deploy.log
          }

          ok=0
          for i in 1 2 3; do
            if deploy; then ok=1; break; fi
            if [ "$i" = "3" ]; then break; fi
            echo "Deploy attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::wrangler pages deploy failed after 3 attempts"
            exit 1
          fi

          DEPLOY_URL=$(grep -oE 'https://[a-z0-9-]+\.newinfragg\.pages\.dev' deploy.log | tail -1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | tail -1 || true)
          fi
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://newinfragg.pages.dev"
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deploy URL: $DEPLOY_URL"

      - name: Smoke test deployed site
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deploy_url }}"
          echo "Smoke-testing $URL ..."

          # Give the edge a few seconds to propagate the new deployment.
          sleep 5

          # 1. Login page is always reachable (it's whitelisted by the
          #    middleware so the auth gate can't lock anyone out).
          HTML=$(curl -fsSL --retry 5 --retry-delay 3 "$URL/login.html")
          if ! echo "$HTML" | grep -q "Cyber News"; then
            echo "::error::HTML at $URL/login.html is missing 'Cyber News'"
            echo "--- response ---"
            echo "$HTML"
            exit 1
          fi

          # 2. /api/health is public and reports DB binding + auth flag.
          HLTH=$(curl -fsSL --retry 5 --retry-delay 3 "$URL/api/health")
          if ! echo "$HLTH" | grep -q '"db":true'; then
            echo "::error::$URL/api/health did not report db=true"
            echo "--- response ---"
            echo "$HLTH"
            exit 1
          fi

          echo "Smoke test passed. Live at: $URL"

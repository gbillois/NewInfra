name: Deploy NewsRadar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # La base D1 est créée au premier run ; son UUID (connu seulement après
      # création) est injecté dans wrangler.jsonc à la place du placeholder.
      - name: Ensure D1 database exists
        run: |
          set -euo pipefail
          NAME=newsradar-db
          ID=$(npx wrangler d1 list --json | jq -r ".[] | select(.name==\"$NAME\") | .uuid")
          if [ -z "$ID" ]; then
            echo "Creating D1 database $NAME"
            npx wrangler d1 create "$NAME"
            ID=$(npx wrangler d1 list --json | jq -r ".[] | select(.name==\"$NAME\") | .uuid")
          fi
          echo "D1 id: $ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply newsradar-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      # Les secrets applicatifs sont poussés s'ils existent côté GitHub.
      # APP_PASSWORD protège l'UI ; ANTHROPIC_API_KEY active Claude pour le
      # nommage des tendances (sinon repli Workers AI).
      - name: Push Worker secrets
        run: |
          set -euo pipefail
          if [ -n "${APP_PASSWORD:-}" ]; then
            echo "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          fi
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Smoke test
        run: |
          set -euo pipefail
          URL=$(npx wrangler deployments list 2>/dev/null | grep -oE 'https://[^ ]*workers.dev' | head -1 || true)
          URL=${URL:-https://newsradar.gerome-billois.workers.dev}
          echo "Testing $URL"
          curl -fsS -o /dev/null -w "login page: %{http_code}\n" "$URL/login" || true

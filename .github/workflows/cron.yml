name: Cyber news cron (collect & synthesize)

# GitHub Actions cron is the stand-in for Cloudflare cron triggers,
# which Pages Functions don't support. The workflow hits the same
# /api/cron/* endpoints that are otherwise callable via the UI refresh
# button. The endpoints are protected by the CRON_SECRET secret set in
# both GitHub Actions and on the Cloudflare Pages project.

on:
  schedule:
    # Collect every hour, at HH:07 to avoid the top-of-hour thundering herd.
    - cron: "7 * * * *"
    # Daily synthesis at 05:15 UTC.
    - cron: "15 5 * * *"
    # Weekly synthesis on Monday at 05:25 UTC.
    - cron: "25 5 * * 1"
    # Fortnightly synthesis on the 1st and 16th of each month at 05:35 UTC.
    - cron: "35 5 1,16 * *"
    # Monthly synthesis on the 1st at 05:45 UTC.
    - cron: "45 5 1 * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run (collect, synth:day, synth:week, synth:fortnight, synth:month)"
        required: true
        default: "collect"

concurrency:
  group: cyber-news-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.APP_BASE_URL || 'https://newinfragg.pages.dev' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Decide which action to run
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Map the cron expression that fired to the action we want.
          case "${{ github.event.schedule }}" in
            "7 * * * *")      echo "action=collect" >> "$GITHUB_OUTPUT" ;;
            "15 5 * * *")     echo "action=synth:day" >> "$GITHUB_OUTPUT" ;;
            "25 5 * * 1")     echo "action=synth:week" >> "$GITHUB_OUTPUT" ;;
            "35 5 1,16 * *")  echo "action=synth:fortnight" >> "$GITHUB_OUTPUT" ;;
            "45 5 1 * *")     echo "action=synth:month" >> "$GITHUB_OUTPUT" ;;
            *)                echo "action=collect" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Call endpoint
        run: |
          set -euo pipefail
          action="${{ steps.decide.outputs.action }}"
          hdr=()
          if [ -n "${CRON_SECRET:-}" ]; then
            hdr=(-H "x-cron-secret: $CRON_SECRET")
          fi
          case "$action" in
            collect)
              url="$BASE_URL/api/cron/collect"
              ;;
            synth:day)
              url="$BASE_URL/api/cron/synthesize?period=day"
              ;;
            synth:week)
              url="$BASE_URL/api/cron/synthesize?period=week"
              ;;
            synth:fortnight)
              url="$BASE_URL/api/cron/synthesize?period=fortnight"
              ;;
            synth:month)
              url="$BASE_URL/api/cron/synthesize?period=month"
              ;;
            *)
              echo "::error::Unknown action: $action"
              exit 1
              ;;
          esac
          echo "POST $url"
          # Retry a few times; the LLM call itself can take a while and
          # Cloudflare sometimes 5xx's briefly during cold starts.
          for i in 1 2 3; do
            if curl -fsS -X POST --max-time 240 "${hdr[@]}" "$url" -o response.json; then
              echo "--- response ---"
              cat response.json
              exit 0
            fi
            echo "Attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          echo "::error::All attempts failed for $url"
          exit 1

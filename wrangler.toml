name = "newinfragg"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# Workers AI binding. Exposed to Pages Functions as `env.AI` so the
# LLM abstraction in functions/_lib/llm.js can call llama-3.3 without
# an external API key. Requires Workers AI to be enabled on the
# Cloudflare account.
[ai]
binding = "AI"

# The `[[d1_databases]]` binding is deliberately NOT committed here.
# wrangler validates `database_id` as a UUID at config-parse time, and
# the id only exists after the database has been created on Cloudflare's
# side. The GitHub Actions workflow (.github/workflows/deploy.yml)
# creates/looks up the database and appends the complete [[d1_databases]]
# block to this file in-place before running migrations or deploying.
#
# Vectorize binding for the vector consolidation mode. Same logic as
# D1: the index must exist on the Cloudflare side before wrangler will
# accept the binding, so the deploy workflow is responsible for
# creating the index and appending the binding. Expected shape once
# appended:
#
#   [[vectorize]]
#   binding = "VECTORIZE"
#   index_name = "articles-bge-m3"  # or "articles-openai-small"
#
# Create the index with:
#   wrangler vectorize create articles-bge-m3 --dimensions=1024 --metric=cosine
#   wrangler vectorize create articles-openai-small --dimensions=1536 --metric=cosine
#
# The vector consolidation modes ('vector-raw', 'vector-narrative')
# require the VECTORIZE binding; the legacy 'llm' mode does NOT and
# continues to work without it.

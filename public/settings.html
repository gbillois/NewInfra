<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NewsRadar — réglages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,500&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="/">NewsRadar<span class="dot">.</span></a>
      <span class="brand-sub">réglages</span>
      <nav>
        <a href="/">Tendances</a>
        <a href="/settings" class="active">Réglages</a>
        <a href="#" id="logout">Sortir</a>
      </nav>
    </header>

    <section class="card">
      <h2>État du système</h2>
      <div class="statgrid" id="stats"></div>
      <div class="add-feed" style="margin-top:18px">
        <button class="btn primary" id="collectBtn">Collecter maintenant</button>
        <button class="btn" id="recompute7">Recalculer 7 jours</button>
        <button class="btn" id="recompute30">Recalculer 30 jours</button>
      </div>
      <div class="notice" id="notice"></div>
    </section>

    <section class="card">
      <h2>Fournisseur et modèle de tendances</h2>
      <div class="add-feed">
        <select id="llmModel"></select>
        <button class="btn primary" id="saveLlmModel">Enregistrer</button>
      </div>
      <div class="notice" id="llmNotice"></div>
    </section>

    <section class="card">
      <h2>Flux RSS</h2>
      <div id="feeds"></div>
      <div class="add-feed">
        <input id="feedUrl" placeholder="https://exemple.com/feed.xml" />
        <input id="feedName" placeholder="Nom (optionnel)" style="max-width:200px" />
        <button class="btn primary" id="addFeed">Ajouter</button>
      </div>
    </section>
  </div>
  <script src="/settings.js"></script>
</body>
</html>
